<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img">
<title>Architecture of qa-agent-mini</title><desc>The model decides the next move. Our code runs the agent loop, the seven tools, the skills, the limits and the trace. The tools drive a browser that shows the page under test. The eval starts the agent many times and counts the bugs found.</desc>
