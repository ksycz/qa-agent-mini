<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ticket price calculator</title>
  <style>
    :root {
      --ground: #dfe8e2;
      --ink: #14213d;
      --ink-soft: #4a5873;
      --paper: #fbfcfa;
      --line: #c3cfc7;
      --stripe: #f2b632;
      --danger: #b3261e;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 3rem 1.25rem 4rem;
      background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.5;
    }
    main { max-width: 56rem; margin: 0 auto; }
    h1 { font-family: var(--serif); font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.1; margin: 0 0 .5rem; letter-spacing: -.01em; }
    .lead { margin: 0 0 2rem; max-width: 34rem; color: var(--ink-soft); }
    .grid { display: grid; gap: 1.5rem; grid-template-columns: 1fr; align-items: start; }
    @media (min-width: 46rem) { .grid { grid-template-columns: 17rem 1fr; gap: 2.5rem; } }

    .form { background: var(--ink); color: var(--paper); padding: 1.5rem; border-radius: 1rem; }
    .form label { display: block; font-weight: 600; margin-bottom: .5rem; }
    .form input {
      width: 100%; font: inherit; font-size: 1.5rem; padding: .6rem .8rem; border-radius: .6rem;
      border: 2px solid transparent; background: var(--paper); color: var(--ink);
    }
    .form button {
      width: 100%; margin-top: 1rem; font: inherit; font-weight: 700; padding: .8rem 1rem; cursor: pointer;
      border: 0; border-radius: .6rem; background: var(--stripe); color: var(--ink);
    }
    .form button:hover { filter: brightness(1.06); }
    input:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .form button:focus-visible { outline-color: var(--stripe); }
    #message { min-height: 1.5rem; margin: .9rem 0 0; font-weight: 600; color: #ffd2cd; }

    #tickets { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    #tickets:empty::before {
      content: "No visitors yet. Enter an age and add the first ticket.";
      display: block; padding: 1.5rem; border: 2px dashed var(--line); border-radius: 1rem; color: var(--ink-soft);
    }
    #tickets li {
      position: relative; padding: 1.1rem 1.5rem 1.1rem 2rem; background: var(--paper);
      border-radius: .8rem; font-size: 1.05rem; font-variant-numeric: tabular-nums;
      box-shadow: 0 1px 0 var(--line);
      border-left: .7rem solid var(--ink);
      animation: stamp .18s ease-out;
      -webkit-mask: radial-gradient(circle .55rem at 0 50%, #0000 98%, #000) ;
              mask: radial-gradient(circle .55rem at 0 50%, #0000 98%, #000);
    }
    #tickets li::after {
      content: ""; position: absolute; top: .6rem; bottom: .6rem; right: 5.2rem; width: 0;
      border-right: 2px dotted var(--line);
    }
    @keyframes stamp { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }

    #total {
      margin: 1.25rem 0 0; padding: 1rem 1.5rem; border-radius: .8rem; background: var(--stripe);
      font-family: var(--serif); font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    @media (prefers-reduced-motion: reduce) { #tickets li { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Ticket price calculator</h1>
    <p class="lead">Add each visitor by age to see the ticket prices and the order total.</p>

    <div class="grid">
      <div class="form">
        <label for="age">Visitor age</label>
        <input id="age" type="number" />
        <button id="add" type="button">Add visitor</button>
        <p id="message" role="alert"></p>
      </div>

      <div>
        <ul id="tickets" aria-label="Tickets"></ul>
        <p id="total" aria-live="polite">Total: €0.00</p>
      </div>
    </div>
  </main>
  <!--INJECTION-->

  <script>window.__BUGS__ = __BUGS_JSON__;</script>
  <script type="module">
    import { priceOrder, maxTickets, formatEuro } from '/pricing.mjs';
    const bugs = window.__BUGS__;
    const ages = [];
    const input = document.getElementById('age');
    const list = document.getElementById('tickets');
    const total = document.getElementById('total');
    const message = document.getElementById('message');

    function render() {
      const order = priceOrder(ages, bugs);
      list.innerHTML = '';
      order.tickets.forEach((t, i) => {
        const li = document.createElement('li');
        li.textContent = `Visitor ${i + 1}, age ${t.age}: ${formatEuro(t.cents)}`;
        list.appendChild(li);
      });
      total.textContent = `Total: ${formatEuro(order.totalCents)}`;
    }

    document.getElementById('add').addEventListener('click', () => {
      message.textContent = '';
      const raw = input.value.trim();
      const age = Number(raw);
      if (raw === '' || !Number.isInteger(age) || age < 0 || age > 120) {
        message.textContent = 'Enter an age from 0 to 120.';
        return;
      }
      if (ages.length >= maxTickets(bugs)) {
        message.textContent = 'Maximum 10 tickets per order.';
        return;
      }
      ages.push(age);
      input.value = '';
      render();
    });
  </script>
</body>
</html>
